services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_REPL_USER: ${MYSQL_REPL_USER}
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./mysql/master/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - mysql_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  mysql-slave1:
    image: mysql:8.0
    container_name: mysql-slave1
    depends_on:
      mysql-master:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_REPL_USER: ${MYSQL_REPL_USER}
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
    volumes:
      - mysql_slave1_data:/var/lib/mysql
      - ./mysql/slave1/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/slave-init:/docker-entrypoint-initdb.d:ro
    networks:
      - mysql_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-slave2:
    image: mysql:8.0
    container_name: mysql-slave2
    depends_on:
      mysql-master:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_REPL_USER: ${MYSQL_REPL_USER}
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
    volumes:
      - mysql_slave2_data:/var/lib/mysql
      - ./mysql/slave2/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/slave-init:/docker-entrypoint-initdb.d:ro
    networks:
      - mysql_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx-lb:
    image: nginx:1.27
    container_name: nginx-lb
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave1:
        condition: service_healthy
      mysql-slave2:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3307:3307"   # escritura -> maestro
      - "3308:3308"   # lectura -> esclavos
    networks:
      - mysql_net  

  sysbench:
    image: severalnines/sysbench
    container_name: sysbench
    profiles: ["bench"]
    entrypoint: ["sysbench"]
    depends_on:
      nginx-lb:
        condition: service_started
    environment:
      SYSBENCH_PASSWORD: ${SYSBENCH_PASSWORD}
    networks:
      - mysql_net

networks:
  mysql_net:
    driver: bridge

volumes:
  mysql_master_data:
  mysql_slave1_data:
  mysql_slave2_data:
